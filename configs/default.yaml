# Every threshold, noise value and qcd lives here. No magic numbers in code.

data:
  euroc_root: /home/shiladitya/Dataset/euroc
  sequence: MH_01_easy
  camera: cam0
  # Ground truth is 200 Hz (5 ms). Refuse to interpolate GT across larger gaps.
  gt_max_gap_ns: 20000000

# M1 sanity check: triangulate ORB matches with GT camera poses and reproject.
m1_check:
  anchor_frames: [1000, 1500, 2200, 3000]  # cam0 frames to start pairs from (MH_01 is ~static before ~900)
  min_baseline_m: 0.20        # second view = first later frame with this GT baseline
  max_frames_ahead: 60        # give up on an anchor if no frame reaches the baseline
  orb_nfeatures: 2000
  lowe_ratio: 0.8
  ransac_thresh_px: 1.0       # F-matrix RANSAC on undistorted points (GT-independent)
  ransac_confidence: 0.999
  min_parallax_deg: 1.0       # drop near-degenerate triangulations
  min_points: 50              # require at least this many triangulated points per pair
  max_median_reproj_px: 1.0   # M1 pass criterion

# Monocular ORB front-end (pose source agnostic: GT in M2, PnP from M3).
frontend:
  orb:
    detect_nfeatures: 6000    # raw ORB detections before bucketing
    nfeatures: 1500           # target after grid bucketing
    grid_rows: 6
    grid_cols: 8
    scale_factor: 1.2
    n_levels: 8
    edge_threshold: 31        # also used as ORB patch size
    fast_threshold: 12
  matching:
    lowe_ratio: 0.8
    max_hamming: 64
    mutual: true
    ransac_thresh_px: 1.0     # F-matrix RANSAC on undistorted points
    ransac_confidence: 0.999
    min_matches: 15           # skip a keyframe pair with fewer descriptor matches
  keyframes:
    min_translation_m: 0.10   # motion policy relative to the last keyframe
    min_rotation_deg: 5.0
    window: 3                 # match new keyframe against this many previous ones
  triangulation:
    min_parallax_deg: 1.0
    max_reproj_px: 2.0
    min_depth_m: 0.1
    max_depth_m: 40.0
    retriangulate_min_obs: 3  # multi-view DLT refinement once a track has this many views
  association:
    max_reproj_px: 3.0        # gate for attaching a matched keypoint to an existing landmark
  # Monocular VO (M3). Map units are arbitrary (scale fixed at init), so the depth limits
  # in `triangulation` are in map units once VO is running, not metres.
  vo:
    init_max_frames: 30       # restart init with a new reference after this many frames
    init_min_flow_px: 20.0    # median feature displacement before attempting init
    init_min_points: 100
    init_min_median_parallax_deg: 1.5
    init_ransac_thresh_px: 1.0
    init_ransac_confidence: 0.999
    init_median_depth: 1.0    # map scale: median init depth in view a
    local_map_keyframes: 5    # landmarks of the last N keyframes are searched each frame
    search_radius_px: [15.0, 40.0]   # projection search radii, widened on PnP failure
    search_max_hamming: 64
    search_lowe_ratio: 1.0     # 1.0 = off; a ratio test here rejected many good matches (ATE 0.64 -> 0.16 m)
    pnp_min_inliers: 30
    pnp_reproj_px: 2.0
    pnp_ransac_iters: 200
    pnp_confidence: 0.999
    kf_min_frame_gap: 2
    kf_max_frame_gap: 10
    kf_tracked_ratio: 0.7     # new keyframe when tracked < ratio * landmarks in last keyframe
    kf_min_tracked: 150

# M2 check: front-end mapping driven by GT camera poses.
m2_check:
  start_frame: 1000
  end_frame: 1800
  min_keyframes: 15
  min_track_len: 3            # "long" track = seen in at least this many keyframes
  min_long_tracks: 200
  max_median_reproj_px: 1.0   # over every view of every long track
  max_p90_reproj_px: 2.0
  min_assoc_accept_ratio: 0.9 # descriptor+RANSAC matches to landmarks that pass the gate

plots:
  clip_percentile: 1.0        # axis limits ignore the outermost landmarks on each side
  pad_m: 0.5
  dpi: 150

# M3 check: monocular VO (init + PnP), Sim(3)-aligned to GT camera positions.
# Without BA the ATE is dominated by scale drift and is sensitive to small changes, so the
# criterion is relative to path length.
m3_check:
  start_frame: 1000           # default segment for eval/plot_m3_vo.py
  end_frame: 1800
  segments: [[1000, 1800], [1800, 2600], [2600, 3400]]
  min_tracked_fraction: 0.90  # init needs some motion first, so a few frames are untracked
  max_ate_fraction_of_path: 0.02
